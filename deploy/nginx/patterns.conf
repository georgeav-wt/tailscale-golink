# Shortcuts that golink itself cannot express: a bare pattern with no name in
# front of it. nginx answers these itself, before the request reaches golink.
#
# The case is load bearing. golink's own URLs are lowercase -- /.all, /.export,
# /.detail/, /.help, /.search -- and every pattern here begins with an
# upper-case letter, so the two cannot collide. Keep it that way: a pattern
# like ~^/(?<id>[a-z]+-\d+)$ would swallow them.
#
# Anything with a name in front of it (go/pr/1234, go/jira/ABC-1234) belongs in
# golink as a link with a pattern, not here. Prefer that: those are editable by
# anyone, while this file needs a deploy.

map $uri $go_target {
    default                              "";

    # go/ABC-1234 -> that Jira issue
    ~^/(?<issue>[A-Z][A-Z0-9]+-\d+)/?$   https://jira.wetravel.com/browse/$issue;
}
