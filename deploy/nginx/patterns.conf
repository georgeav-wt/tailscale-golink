# Shortcuts that golink itself cannot express: a bare pattern with no name in
# front of it. nginx recognises the *shape* of a Jira ticket and hands it to
# golink as go/jira/<TICKET>, which the "jira" link resolves with its pattern.
#
#     go/WTRAV-123456  ->  go/jira/WTRAV-123456  ->  wherever go/jira points
#     go/wtrav-123456  ->  go/jira/WTRAV-123456  ->  the same place
#
# The indirection is the point. nginx knows nothing about Jira -- not its
# hostname, not its URL shape -- so moving Jira, or sending tickets somewhere
# else entirely, is an edit to the go/jira link that anyone can make, with no
# deploy. It also means the two paths agree by construction: go/jira/WTRAV-1
# typed by hand and go/WTRAV-1 land in the same place.
#
# **go/jira has to exist and have a pattern**, or these redirects arrive at
# golink's create form for the name "jira/WTRAV-123456". That is a visible
# failure rather than a silently broken link, which is the right way round.
#
# **Matching is case-insensitive, and the key is rewritten to upper case**, so
# go/wtrav-1 and go/WtRav-1 both reach browse/WTRAV-1: Jira is sent one spelling
# whatever was typed, and go/jira's click count is not split across variants.
# That is why there is a line per project rather than one regex with the keys
# in an alternation -- nginx has no way to upper-case a captured string, so each
# line carries its own canonical key. Adding a project is one line; the order
# does not matter, since the key is anchored between the / and the -.
#
# **The cost of case-insensitivity is link names of that shape.** go/pd-1234,
# go/it-2026 and go/br-99 can no longer be created and reached -- they redirect
# to Jira instead. There were none when this changed, and the short keys (BI,
# BR, IE, IS, IT, PD, PI) are the ones to keep in mind. golink's own routes are
# safe: they all begin with a dot.
#
# The projects are listed rather than matched by shape for the same reason a
# rule like ~*^/([a-z][a-z0-9]+-\d+)$ is not used: it would swallow any link
# somebody named go/q1-2026 or go/okr-2026, and a name that stops resolving
# without explanation is worse than a new project needing a line here.
#
# Anything with a name in front of it (go/pr/1234, go/jira/ABC-1234) is already
# golink's job -- a link with a pattern. Prefer that: those are editable by
# anyone, while this file needs a deploy.

map $uri $go_target {
    default "";

    # One line per Jira project: match the key in any case, hand golink the
    # canonical one.
    ~*^/aar-(?<n>\d+)/?$      /jira/AAR-$n;
    ~*^/bi-(?<n>\d+)/?$       /jira/BI-$n;
    ~*^/bpm-(?<n>\d+)/?$      /jira/BPM-$n;
    ~*^/br-(?<n>\d+)/?$       /jira/BR-$n;
    ~*^/comops-(?<n>\d+)/?$   /jira/COMOPS-$n;
    ~*^/cops-(?<n>\d+)/?$     /jira/COPS-$n;
    ~*^/csops-(?<n>\d+)/?$    /jira/CSOPS-$n;
    ~*^/dops-(?<n>\d+)/?$     /jira/DOPS-$n;
    ~*^/epic-(?<n>\d+)/?$     /jira/EPIC-$n;
    ~*^/hrs-(?<n>\d+)/?$      /jira/HRS-$n;
    ~*^/ie-(?<n>\d+)/?$       /jira/IE-$n;
    ~*^/is-(?<n>\d+)/?$       /jira/IS-$n;
    ~*^/it-(?<n>\d+)/?$       /jira/IT-$n;
    ~*^/itops-(?<n>\d+)/?$    /jira/ITOPS-$n;
    ~*^/pd-(?<n>\d+)/?$       /jira/PD-$n;
    ~*^/pi-(?<n>\d+)/?$       /jira/PI-$n;
    ~*^/skp-(?<n>\d+)/?$      /jira/SKP-$n;
    ~*^/ssp-(?<n>\d+)/?$      /jira/SSP-$n;
    ~*^/wtbi-(?<n>\d+)/?$     /jira/WTBI-$n;
    ~*^/wtcs-(?<n>\d+)/?$     /jira/WTCS-$n;
    ~*^/wtfr-(?<n>\d+)/?$     /jira/WTFR-$n;
    ~*^/wtfrm-(?<n>\d+)/?$    /jira/WTFRM-$n;
    ~*^/wtmp-(?<n>\d+)/?$     /jira/WTMP-$n;
    ~*^/wtrav-(?<n>\d+)/?$    /jira/WTRAV-$n;
}
