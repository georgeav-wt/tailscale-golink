# LOCAL DEVELOPMENT ONLY. This authenticates nobody.
#
# It stands in for the production config in deploy/nginx/golink.conf, which
# authenticates every request through oauth2-proxy, and instead tells golink
# that every visitor is one fixed person. That is a complete authentication
# bypass, which is the point: it makes the flow testable in a browser without
# Google. Never deploy this file, and never copy these proxy_set_header lines
# into something that is deployed.
#
# To test as somebody else, edit the two headers below and restart:
#   podman compose restart nginx

server {
    listen 80 default_server;
    server_name _;

    # The pattern redirects below send a path, not a URL, and nginx would
    # otherwise expand it into an absolute one built from the port *it* listens
    # on and the scheme it sees -- http://host:9292/jira/... behind a TLS load
    # balancer on 443. Relative is both correct and shorter: the browser
    # resolves it against the URL it asked for, whatever that was.
    absolute_redirect off;

    # A bare pattern is a redirect nginx makes on its own; see patterns.conf.
    if ($go_target) {
        return 302 $go_target;
    }

    location / {
        proxy_set_header X-Auth-Request-Email  dev@wetravel.com;
        proxy_set_header X-Auth-Request-Groups infra@wetravel.com;

        proxy_set_header Host $http_host;
        proxy_pass http://golink:8080;
    }
}
