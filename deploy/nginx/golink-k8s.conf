# nginx in front of golink in the cluster, with oauth2-proxy authenticating
# every request. Baked into the image by deploy/nginx/Dockerfile; the compose
# stacks use golink.conf and golink-dev.conf instead.
#
#   ALB -> nginx -> (subrequest) oauth2-proxy -> Google
#                -> golink
#
# golink is given the names of the headers this sets, with -auth-email-header
# and -auth-groups-header, and refuses a request that arrives without the email
# one. It cannot tell a header nginx set from one a client sent, so two things
# here are load bearing, and both are called out again where they appear below:
# this config SETS the headers rather than passing them through, and nothing
# but nginx may open a connection to golink. In the cluster that second part is
# a NetworkPolicy, not a convention.

server {
    # 9292 is the port every service in this cluster serves on, and the only
    # one besides 80 that the platform's NetworkPolicy allows between pods --
    # so nginx listens on it, reaches golink on it, and the Service needs no
    # special case. It is also above 1024, which this unprivileged image needs.
    listen 9292 default_server;
    server_name _;

    # Nothing gains from knowing the version.
    server_tokens off;

    # What the load balancer and the pod probe ask for, and the one path that
    # must never need a session -- an ALB target group with a 302 to Google for
    # a health check has no healthy targets, and no traffic reaches golink at
    # all. It says only that nginx is up; whether golink is, is golink's own
    # probe (see -healthcheck-path).
    location = /healthcheck {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # A bare pattern is a redirect nginx makes on its own; see patterns.conf.
    # Deliberately ahead of authentication: it discloses nothing, and it keeps
    # a Jira link working while a session is expiring.
    if ($go_target) {
        return 302 $go_target;
    }

    # oauth2-proxy's own endpoints have to be reachable unauthenticated, or
    # signing in could never complete.
    location /oauth2/ {
        proxy_pass       http://wt-oauth2-proxy:9292;
        proxy_set_header Host                    $http_host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto       $fwd_proto;
        proxy_set_header X-Auth-Request-Redirect $fwd_proto://$http_host$request_uri;
    }

    # The subrequest nginx makes for every other request. Not reachable from
    # outside: "internal" means only nginx can ask.
    location = /oauth2/auth {
        internal;
        proxy_pass              http://wt-oauth2-proxy:9292;
        proxy_set_header        Host               $http_host;
        proxy_set_header        X-Real-IP          $remote_addr;
        proxy_set_header        X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto  $fwd_proto;
        # Deciding who somebody is needs no request body.
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;

        # oauth2-proxy answers the subrequest with the identity in its response
        # headers; requires --set-xauthrequest on oauth2-proxy. Groups arrive
        # only if oauth2-proxy is configured to look them up: with the Google
        # provider that needs a service account and --google-group, and without
        # it this header is empty and only user rows in golink's Admins table
        # grant admin.
        auth_request_set $auth_email  $upstream_http_x_auth_request_email;
        auth_request_set $auth_groups $upstream_http_x_auth_request_groups;

        # SET, never pass through. Redefining a header replaces whatever the
        # client sent under that name, and an empty value drops it entirely, so
        # a request that forges an identity cannot keep it. This is what golink
        # is trusting when it reads these headers.
        proxy_set_header X-Auth-Request-Email  $auth_email;
        proxy_set_header X-Auth-Request-Groups $auth_groups;

        # $http_host, not $host: $host drops the port, and golink builds the
        # go/ URLs shown in its own pages out of it.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        # A literal Service name, resolved once when nginx starts. That is
        # sound here and not in compose, because a Service keeps its ClusterIP
        # for its whole life -- but it does mean nginx will not start at all
        # until the Service object exists ("host not found in upstream"), so a
        # first deploy of this app before golink's crashloops until it is
        # there. It recovers by itself; do not read it as broken config.
        proxy_pass http://wt-golink:9292;
    }

    # Note there is no skip_auth_regex, and none should be added for /. paths:
    # /.export hands out every link in one request, and /.metrics names every
    # link in its labels. Scrape the golink pod directly, not through here.
}
