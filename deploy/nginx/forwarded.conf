# What the request looked like before the load balancer in front of us. TLS
# terminates at the ALB, so nginx sees plain HTTP and $scheme says "http" --
# which would make oauth2-proxy send the browser back to an http:// URL after
# signing in. Take the scheme from the header the ALB sets, and fall back to
# nginx's own view when there is no such header, so this file is also correct
# when nothing is in front.

map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
