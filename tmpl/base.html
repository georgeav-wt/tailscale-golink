<!doctype html>
<html lang="en">
<head>
  <title>{{go}}/</title>
  <link rel="stylesheet" href="/.static/base.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="search" type="application/opensearchdescription+xml" title="searchTitle" href="/.opensearch" />
  <link rel="icon" href="/.static/favicon.png">
  <link rel="icon" href="/.static/favicon.svg">
  <style>
    /* The pattern fields belong to links that answer for the paths below their
       name, which few links do, so they are shown only when a link says it is
       one. Revealing them without any JavaScript needs the checkbox to be a
       preceding sibling of the fields it reveals. */
    .dynamic-toggle { vertical-align: middle; margin: 1rem 0.5rem 0 0; }
    .dynamic-toggle + label { vertical-align: middle; }
    .dynamic-fields { display: none; }
    .dynamic-toggle:checked ~ .dynamic-fields { display: block; }
  </style>
</head>
<body class="flex flex-col min-h-screen">
  <div class="bg-gray-100 border-b border-gray-200 pt-4 pb-2 mb-6">
    <header class="container mx-auto px-4">
      <h1 class="text-2xl font-bold pb-1"><a class="text-blue-600 hover:underline" href="/" title="All of {{go}}: create a link, or see the ones that exist">{{go}}/</a></h1>
      A private shortlink service
    </header>
  </div>

  <main class="container mx-auto px-4 flex-1">
    {{ block "main" .}}{{ end }}
  </main>
  <footer class="bg-gray-100 border-t border-gray-200 pt-2 pb-2 mt-6">
    <div class="container mx-auto px-4 leading-6 text-right text-sm text-gray-500">
      <a class="hover:underline hover:text-blue-500" href="/.help">Help</a>
      &middot;
      <a class="hover:underline hover:text-blue-500" href="https://github.com/tailscale/golink">Built on golink</a>
    </div>
  </footer>
</html>
